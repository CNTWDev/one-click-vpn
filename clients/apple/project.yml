name: Veilbird
options:
  bundleIdPrefix: com.veilbird.client.dev
  deploymentTarget:
    iOS: "16.0"
    macOS: "13.0"
packages:
  VeilbirdCore:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Bundle identifier prefix: development builds keep this placeholder; release builds pass the registered one
    # (GitHub variable VEILBIRD_APPLE_BUNDLE_ID, see clients/RELEASING.md).
    VEILBIRD_BUNDLE_ID: com.veilbird.client.dev
    INFOPLIST_KEY_VeilbirdKeychainGroup: $(AppIdentifierPrefix)$(VEILBIRD_BUNDLE_ID).shared
    # Shared by the app and its tunnel: the diagnostic log, routing choice and blocked-transport memory.
    INFOPLIST_KEY_VeilbirdAppGroup: group.$(VEILBIRD_BUNDLE_ID)
    INFOPLIST_KEY_VeilbirdAPIOrigin: $(VEILBIRD_API_ORIGIN)
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
targets:
  Veilbird-iOS:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VEILBIRD_BUNDLE_ID).ios
        PRODUCT_NAME: Veilbird
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: TrackNothing
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    dependencies:
      - package: VeilbirdCore
      - target: VeilbirdTunnel-iOS
    entitlements:
      path: Signing/iOS.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        keychain-access-groups: [$(AppIdentifierPrefix)$(VEILBIRD_BUNDLE_ID).shared]
        com.apple.security.application-groups: [group.$(VEILBIRD_BUNDLE_ID)]
  Veilbird-macOS:
    type: application
    platform: macOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VEILBIRD_BUNDLE_ID).macos
        PRODUCT_NAME: Veilbird
        INFOPLIST_KEY_CFBundleDisplayName: TrackNothing
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Direct download (Developer ID): hardened runtime for notarization; the tunnel is a system extension, which
        # runs as root, so it shares no keychain or app group container with the app (TunnelControl hands it what it needs).
        ENABLE_HARDENED_RUNTIME: YES
        INFOPLIST_KEY_VeilbirdAppGroup: $(TeamIdentifierPrefix)$(VEILBIRD_BUNDLE_ID)
        PROVISIONING_PROFILE_SPECIFIER: $(VEILBIRD_MACOS_APP_PROFILE)
    dependencies:
      - package: VeilbirdCore
      - target: VeilbirdTunnel-macOS
    entitlements:
      path: Signing/macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.developer.networking.networkextension: [packet-tunnel-provider-systemextension]
        com.apple.developer.system-extension.install: true
        keychain-access-groups: [$(AppIdentifierPrefix)$(VEILBIRD_BUNDLE_ID).shared]
        com.apple.security.application-groups: [$(TeamIdentifierPrefix)$(VEILBIRD_BUNDLE_ID)]
  VeilbirdTunnel-iOS:
    type: app-extension
    platform: iOS
    sources: [PacketTunnel, Shared]
    dependencies:
      # The shared mihomo core (clients/core/build-apple.sh); same transports and routing as Android and Windows.
      - framework: .deps/TunnelCore.xcframework
        embed: false
      - sdk: libresolv.tbd
      - sdk: SystemConfiguration.framework
      - sdk: Security.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VEILBIRD_BUNDLE_ID).ios.tunnel
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: Signing/iOSTunnel.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: Signing/iOSTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        keychain-access-groups: [$(AppIdentifierPrefix)$(VEILBIRD_BUNDLE_ID).shared]
        com.apple.security.application-groups: [group.$(VEILBIRD_BUNDLE_ID)]
  VeilbirdTunnel-macOS:
    # A system extension, not an app extension: Apple accepts Network Extension app extensions only from the Mac
    # App Store, while a Developer ID (direct download) build needs this form. macOS asks once in System Settings →
    # Privacy & Security before it loads (SystemExtension.swift).
    type: system-extension
    platform: macOS
    sources: [PacketTunnel, PacketTunnelMac, Shared]
    dependencies:
      # The shared mihomo core (clients/core/build-apple.sh); same transports and routing as Android and Windows.
      - framework: .deps/TunnelCore.xcframework
        embed: false
      - sdk: libresolv.tbd
      - sdk: SystemConfiguration.framework
      - sdk: Security.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VEILBIRD_BUNDLE_ID).macos.tunnel
        # macOS requires the bundle to be named <bundle identifier>.systemextension.
        PRODUCT_NAME: $(PRODUCT_BUNDLE_IDENTIFIER)
        PRODUCT_MODULE_NAME: VeilbirdTunnel
        ENABLE_HARDENED_RUNTIME: YES
        INFOPLIST_KEY_VeilbirdKeychainGroup: ""
        INFOPLIST_KEY_VeilbirdAppGroup: $(TeamIdentifierPrefix)$(VEILBIRD_BUNDLE_ID)
        PROVISIONING_PROFILE_SPECIFIER: $(VEILBIRD_MACOS_TUNNEL_PROFILE)
    info:
      path: Signing/macOSTunnel.plist
      properties:
        NSSystemExtensionUsageDescription: TrackNothing uses this extension to create its VPN connection.
        NetworkExtension:
          # Must start with one of the extension's app groups.
          NEMachServiceName: $(TeamIdentifierPrefix)$(VEILBIRD_BUNDLE_ID).tunnel
          NEProviderClasses:
            com.apple.networkextension.packet-tunnel: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: Signing/macOSTunnel.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.developer.networking.networkextension: [packet-tunnel-provider-systemextension]
        com.apple.security.application-groups: [$(TeamIdentifierPrefix)$(VEILBIRD_BUNDLE_ID)]
schemes:
  Veilbird-iOS:
    build:
      targets:
        Veilbird-iOS: all
  Veilbird-macOS:
    build:
      targets:
        Veilbird-macOS: all
