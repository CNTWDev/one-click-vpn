auth_enabled: false

server:
  http_listen_port: 3100

common:
  # Not /loki itself: earlier versions left an index there that points at the retired MinIO store.
  path_prefix: /loki/fs
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  # A single node keeps chunks and index on its own volume; an object store added a service and a
  # password to run for nothing at this size.
  storage:
    filesystem:
      chunks_directory: /loki/fs/chunks
      rules_directory: /loki/fs/rules

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

ingester:
  wal:
    enabled: true
    dir: /loki/fs/wal

compactor:
  working_directory: /loki/fs/compactor
  compaction_interval: 5m
  retention_enabled: true
  retention_delete_delay: 5m
  delete_request_store: filesystem

limits_config:
  retention_period: 336h
  max_query_lookback: 336h
  deletion_mode: filter-and-delete

analytics:
  reporting_enabled: false
