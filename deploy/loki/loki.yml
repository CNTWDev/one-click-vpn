auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    s3:
      endpoint: minio:9000
      bucketnames: northstar-logs
      access_key_id: northstar
      secret_access_key: ${NORTHSTAR_LOG_STORAGE_PASSWORD}
      s3forcepathstyle: true
      insecure: true

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: index_
        period: 24h

ingester:
  wal:
    enabled: true
    dir: /loki/wal

compactor:
  working_directory: /loki/compactor
  compaction_interval: 5m
  retention_enabled: true
  retention_delete_delay: 5m
  delete_request_store: s3

limits_config:
  retention_period: 336h
  max_query_lookback: 336h
  deletion_mode: filter-and-delete

analytics:
  reporting_enabled: false
