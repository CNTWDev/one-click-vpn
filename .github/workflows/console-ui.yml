name: Console UI checks
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['admin-web/**', 'shared/**', 'tests/console-*.mjs', 'tests/fixtures/**', 'frontend-server.mjs', '.github/workflows/console-ui.yml']
  pull_request:
    paths: ['admin-web/**', 'shared/**', 'tests/console-*.mjs', 'tests/fixtures/**', 'frontend-server.mjs', '.github/workflows/console-ui.yml']
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run i18n:check
      - run: npm run build:admin-web
      # Browser tests run only when VEILBIRD_TEST_PLAYWRIGHT points at playwright-core; it is not a project dependency.
      - run: npm install --no-save playwright-core@1.56 && npx playwright-core install --with-deps chromium
      - name: Layout and locale checks (every page, zh/en/ru, 1440/1100/820/390 px)
        run: node --test tests/console-layout.test.mjs tests/console-i18n-ui.test.mjs
        env:
          VEILBIRD_TEST_PLAYWRIGHT: ${{ github.workspace }}/node_modules/playwright-core/index.mjs
          VEILBIRD_LAYOUT_SHOTS: ${{ runner.temp }}/console-layout
      # Surface the problems as annotations so they are readable without downloading logs or screenshots.
      - if: failure()
        run: |
          f="$RUNNER_TEMP/console-layout/failures.txt"
          test -f "$f" || exit 0
          summary=$(sed -E 's/^(zh|en|ru) [0-9]+px ([a-z-]+): \[([a-z]+)\].*/\3 \2/' "$f" | sort | uniq -c | sort -rn | head -30 | awk '{printf "%s%%0A", $0}')
          echo "::error title=Layout problems by kind and view::${summary}"
          head -8 "$f" | while IFS= read -r line; do echo "::error title=Layout problem::${line}"; done
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: console-layout-screenshots
          path: ${{ runner.temp }}/console-layout
