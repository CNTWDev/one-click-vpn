name: Client release
# Builds signed clients and publishes them to the beta channel of the Controller's
# release catalog. Promotion to stable stays a one-click decision in Console → 客户端发布.
#
# Trigger: push a tag like client-v1.2.0 (the version must match clients/version.json),
# or run manually. The build number is this workflow's run number.
#
# Repository variables: VEILBIRD_RELEASE_API (Controller origin), VEILBIRD_API_ORIGIN
#   (origin baked into prod apps), VEILBIRD_RELEASE_WINDOWS ('true' to also ship Windows).
# Secrets: VEILBIRD_RELEASE_TOKEN, VEILBIRD_ANDROID_KEYSTORE_BASE64,
#   VEILBIRD_ANDROID_KEYSTORE_PASSWORD, VEILBIRD_ANDROID_KEY_ALIAS, VEILBIRD_ANDROID_KEY_PASSWORD.
# The Controller needs VEILBIRD_RELEASE_STORAGE=s3 so CI can upload installers.
on:
  push:
    tags: ['client-v*']
  workflow_dispatch:
    inputs:
      windows:
        description: Also build and publish Windows
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: client-release
  cancel-in-progress: false
env:
  VEILBIRD_BUILD_NUMBER: ${{ github.run_number }}
  VEILBIRD_RELEASE_API: ${{ vars.VEILBIRD_RELEASE_API }}
  VEILBIRD_RELEASE_TOKEN: ${{ secrets.VEILBIRD_RELEASE_TOKEN }}
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run i18n:check
      - id: version
        run: |
          version=$(jq -r .version clients/version.json)
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "client-v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match clients/version.json ($version)"; exit 1
          fi
          if [[ -z "$VEILBIRD_RELEASE_API" || -z "$VEILBIRD_RELEASE_TOKEN" ]]; then
            echo "::error::Set the VEILBIRD_RELEASE_API variable and VEILBIRD_RELEASE_TOKEN secret"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
  android:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      VEILBIRD_API_ORIGIN: ${{ vars.VEILBIRD_API_ORIGIN }}
      VEILBIRD_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.VEILBIRD_ANDROID_KEYSTORE_PASSWORD }}
      VEILBIRD_ANDROID_KEY_ALIAS: ${{ secrets.VEILBIRD_ANDROID_KEY_ALIAS }}
      VEILBIRD_ANDROID_KEY_PASSWORD: ${{ secrets.VEILBIRD_ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The legacy default 'tools' package no longer exists in the SDK repository.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.5'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore signing key
        env:
          KEYSTORE: ${{ secrets.VEILBIRD_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE" ]]; then echo "::error::VEILBIRD_ANDROID_KEYSTORE_BASE64 is not set"; exit 1; fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "VEILBIRD_ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - run: gradle -p clients/android :app:assembleProdRelease
      - name: Verify signature
        run: |
          apk=clients/android/app/build/outputs/apk/prod/release/app-prod-release.apk
          "$ANDROID_HOME"/build-tools/35.0.0/apksigner verify --print-certs "$apk"
          mv "$apk" "Veilbird-${{ needs.prepare.outputs.version }}-$VEILBIRD_BUILD_NUMBER.apk"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publish to beta
        run: >-
          node scripts/release-client.mjs --platform android --arch universal --channel beta --publish
          --version "${{ needs.prepare.outputs.version }}" --build "$VEILBIRD_BUILD_NUMBER" --min-os "Android 8.0"
          --notes "${{ github.ref_name }} (${{ github.sha }})"
          --file "Veilbird-${{ needs.prepare.outputs.version }}-$VEILBIRD_BUILD_NUMBER.apk"
      - run: rm -f "$RUNNER_TEMP/release.jks"
        if: always()
  windows:
    needs: prepare
    if: inputs.windows || vars.VEILBIRD_RELEASE_WINDOWS == 'true'
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - runtime: win-x64
            arch: x64
          - runtime: win-arm64
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - shell: pwsh
        run: ./clients/windows/build.ps1 -Runtime ${{ matrix.runtime }} -Version ${{ needs.prepare.outputs.version }} -Build $env:VEILBIRD_BUILD_NUMBER
      - shell: pwsh
        run: >-
          node scripts/release-client.mjs --platform windows --arch ${{ matrix.arch }} --channel beta --publish
          --version "${{ needs.prepare.outputs.version }}" --build "$env:VEILBIRD_BUILD_NUMBER" --min-os "Windows 10"
          --notes "${{ github.ref_name }} (${{ github.sha }})"
          --file "clients/windows/artifacts/Veilbird-${{ needs.prepare.outputs.version }}-$env:VEILBIRD_BUILD_NUMBER-${{ matrix.runtime }}.zip"
