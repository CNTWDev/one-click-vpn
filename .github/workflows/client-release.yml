name: Client release
# Builds installable, signed clients. Every run keeps the installers as downloadable artifacts of the run
# (Actions → this run → Artifacts), so they can be uploaded by hand in Console → 客户端发布. When the
# Controller is configured below, CI also uploads them itself and publishes to the beta channel; promotion
# to stable stays a one-click decision in Console. Step-by-step guide: clients/RELEASING.md.
#
# Trigger: push a tag like client-v1.2.0 (the version must match clients/version.json),
# or run manually. The build number is this workflow's run number.
#
# Android (always): secrets VEILBIRD_ANDROID_KEYSTORE_BASE64, VEILBIRD_ANDROID_KEYSTORE_PASSWORD,
#   VEILBIRD_ANDROID_KEY_ALIAS, VEILBIRD_ANDROID_KEY_PASSWORD (scripts/android-keystore.sh makes them).
# Auto-publish (optional): variable VEILBIRD_RELEASE_API (Controller origin) + secret VEILBIRD_RELEASE_TOKEN.
# Variable VEILBIRD_API_ORIGIN: service origin baked into the apps.
# Windows: an Inno Setup installer per architecture (x64, arm64), always built.
# Mac: a signed, notarized DMG (Developer ID), built once these are set, skipped with a notice otherwise:
#   variables VEILBIRD_APPLE_TEAM_ID, VEILBIRD_APPLE_BUNDLE_ID; secrets VEILBIRD_APPLE_API_KEY_ID,
#   VEILBIRD_APPLE_API_ISSUER_ID, VEILBIRD_APPLE_API_KEY_P8, VEILBIRD_MACOS_DEVELOPER_ID_P12 (base64),
#   VEILBIRD_MACOS_DEVELOPER_ID_P12_PASSWORD. iPhone (TestFlight) comes later; see clients/RELEASING.md.
on:
  push:
    tags: ['client-v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: client-release
  cancel-in-progress: false
env:
  VEILBIRD_BUILD_NUMBER: ${{ github.run_number }}
  VEILBIRD_RELEASE_API: ${{ vars.VEILBIRD_RELEASE_API }}
  VEILBIRD_RELEASE_TOKEN: ${{ secrets.VEILBIRD_RELEASE_TOKEN }}
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run i18n:check
      - id: version
        run: |
          version=$(jq -r .version clients/version.json)
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "client-v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match clients/version.json ($version)"; exit 1
          fi
          publish=false
          if [[ -n "$VEILBIRD_RELEASE_API" && -n "$VEILBIRD_RELEASE_TOKEN" ]]; then publish=true
          else echo "::notice::VEILBIRD_RELEASE_API / VEILBIRD_RELEASE_TOKEN not set: installers stay as run artifacts for upload in Console"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
  android:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      VEILBIRD_API_ORIGIN: ${{ vars.VEILBIRD_API_ORIGIN }}
      VEILBIRD_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.VEILBIRD_ANDROID_KEYSTORE_PASSWORD }}
      VEILBIRD_ANDROID_KEY_ALIAS: ${{ secrets.VEILBIRD_ANDROID_KEY_ALIAS }}
      VEILBIRD_ANDROID_KEY_PASSWORD: ${{ secrets.VEILBIRD_ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The legacy default 'tools' package no longer exists in the SDK repository.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.5'
      - uses: actions/setup-go@v5
        with:
          go-version-file: clients/core/go.mod
          cache-dependency-path: clients/core/go.sum
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      # The embedded core (mihomo) as an AAR; Gradle links it from app/libs.
      - run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018" bash clients/core/build-android.sh
      - name: Restore signing key
        env:
          KEYSTORE: ${{ secrets.VEILBIRD_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE" ]]; then echo "::error::VEILBIRD_ANDROID_KEYSTORE_BASE64 is not set (run scripts/android-keystore.sh once)"; exit 1; fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "VEILBIRD_ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - run: gradle -p clients/android :app:assembleProdRelease
      - name: Verify signature
        run: |
          # Same build number, two architectures: arm64 for nearly every phone, universal for the rest.
          out=clients/android/app/build/outputs/apk/prod/release name="TrackNothing-${{ needs.prepare.outputs.version }}-$VEILBIRD_BUILD_NUMBER"
          for apk in "$out/app-prod-arm64-v8a-release.apk" "$out/app-prod-universal-release.apk"; do
            "$ANDROID_HOME"/build-tools/35.0.0/apksigner verify --print-certs "$apk"
          done
          mv "$out/app-prod-arm64-v8a-release.apk" "$name-arm64.apk"
          mv "$out/app-prod-universal-release.apk" "$name.apk"
          ls -l TrackNothing-*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TrackNothing-android-${{ needs.prepare.outputs.version }}-${{ github.run_number }}
          path: TrackNothing-*.apk
          if-no-files-found: error
      - uses: actions/setup-node@v4
        if: needs.prepare.outputs.publish == 'true'
        with:
          node-version: '22'
      - name: Publish to beta
        if: needs.prepare.outputs.publish == 'true'
        run: |
          name="TrackNothing-${{ needs.prepare.outputs.version }}-$VEILBIRD_BUILD_NUMBER"
          for arch in arm64 universal; do
            file="$name.apk"; [[ $arch == arm64 ]] && file="$name-arm64.apk"
            node scripts/release-client.mjs --platform android --arch "$arch" --channel beta --publish \
              --version "${{ needs.prepare.outputs.version }}" --build "$VEILBIRD_BUILD_NUMBER" --min-os "Android 8.0" \
              --notes "${{ github.ref_name }} (${{ github.sha }})" --file "$file"
          done
      - run: rm -f "$RUNNER_TEMP/release.jks"
        if: always()
  windows:
    needs: prepare
    runs-on: windows-latest
    env:
      VEILBIRD_API_ORIGIN: ${{ vars.VEILBIRD_API_ORIGIN }}
    strategy:
      matrix:
        include:
          - runtime: win-x64
            arch: x64
          - runtime: win-arm64
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # The shared core (veilbird-core.exe) is cross-built with Go by build.ps1.
      - uses: actions/setup-go@v5
        with:
          go-version-file: clients/core/go.mod
          cache-dependency-path: clients/core/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - shell: pwsh
        run: ./clients/windows/build.ps1 -Runtime ${{ matrix.runtime }} -Version ${{ needs.prepare.outputs.version }} -Build $env:VEILBIRD_BUILD_NUMBER -Installer
      - uses: actions/upload-artifact@v4
        with:
          name: TrackNothing-windows-${{ matrix.arch }}-${{ needs.prepare.outputs.version }}-${{ github.run_number }}
          path: clients/windows/artifacts/TrackNothing-*-setup.exe
          if-no-files-found: error
      - shell: pwsh
        if: needs.prepare.outputs.publish == 'true'
        run: >-
          node scripts/release-client.mjs --platform windows --arch ${{ matrix.arch }} --channel beta --publish
          --version "${{ needs.prepare.outputs.version }}" --build "$env:VEILBIRD_BUILD_NUMBER" --min-os "Windows 10"
          --notes "${{ github.ref_name }} (${{ github.sha }})"
          --file "clients/windows/artifacts/TrackNothing-${{ needs.prepare.outputs.version }}-$env:VEILBIRD_BUILD_NUMBER-${{ matrix.runtime }}-setup.exe"
  macos:
    needs: prepare
    runs-on: macos-15
    env:
      VEILBIRD_API_ORIGIN: ${{ vars.VEILBIRD_API_ORIGIN }}
      VEILBIRD_APPLE_TEAM_ID: ${{ vars.VEILBIRD_APPLE_TEAM_ID }}
      VEILBIRD_APPLE_BUNDLE_ID: ${{ vars.VEILBIRD_APPLE_BUNDLE_ID }}
      VEILBIRD_APPLE_API_KEY_ID: ${{ secrets.VEILBIRD_APPLE_API_KEY_ID }}
      VEILBIRD_APPLE_API_ISSUER_ID: ${{ secrets.VEILBIRD_APPLE_API_ISSUER_ID }}
      VEILBIRD_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - id: ready
        env:
          P8: ${{ secrets.VEILBIRD_APPLE_API_KEY_P8 }}
          P12: ${{ secrets.VEILBIRD_MACOS_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.VEILBIRD_MACOS_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          missing=""
          for name in VEILBIRD_APPLE_TEAM_ID VEILBIRD_APPLE_BUNDLE_ID VEILBIRD_APPLE_API_KEY_ID VEILBIRD_APPLE_API_ISSUER_ID P8 P12 P12_PASSWORD; do
            [[ -n "${!name}" ]] || missing="$missing $name"
          done
          if [[ -n "$missing" ]]; then
            echo "::notice::Mac DMG skipped: Apple signing is not configured (missing:$missing). See clients/RELEASING.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else echo "ready=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.ready.outputs.ready == 'true'
      - uses: actions/setup-go@v5
        if: steps.ready.outputs.ready == 'true'
        with:
          go-version-file: clients/core/go.mod
          cache-dependency-path: clients/core/go.sum
      - uses: actions/setup-node@v4
        if: steps.ready.outputs.ready == 'true'
        with:
          node-version: '22'
      - run: brew install xcodegen
        if: steps.ready.outputs.ready == 'true'
      - name: Import signing certificate and API key
        if: steps.ready.outputs.ready == 'true'
        env:
          P8: ${{ secrets.VEILBIRD_APPLE_API_KEY_P8 }}
          P12: ${{ secrets.VEILBIRD_MACOS_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.VEILBIRD_MACOS_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db" password=$(openssl rand -hex 16)
          echo "$P12" | base64 -d > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          # The Developer ID intermediate, in case the runner image lacks it.
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain" -T /usr/bin/codesign || true
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$P12_PASSWORD" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/developer-id.p12"
          printf '%s\n' "$P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "VEILBIRD_APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Install provisioning profiles
        if: steps.ready.outputs.ready == 'true'
        run: >-
          node scripts/apple-profiles.mjs --type MAC_APP_DIRECT
          --bundle "$VEILBIRD_APPLE_BUNDLE_ID.macos=VEILBIRD_MACOS_APP_PROFILE"
          --bundle "$VEILBIRD_APPLE_BUNDLE_ID.macos.tunnel=VEILBIRD_MACOS_TUNNEL_PROFILE" >> "$GITHUB_ENV"
      - name: Build, sign and notarize
        if: steps.ready.outputs.ready == 'true'
        run: bash clients/apple/scripts/release-macos.sh
      - uses: actions/upload-artifact@v4
        if: steps.ready.outputs.ready == 'true'
        with:
          name: TrackNothing-macos-${{ needs.prepare.outputs.version }}-${{ github.run_number }}
          path: clients/apple/artifacts/release/TrackNothing-*-macos.dmg
          if-no-files-found: error
      - name: Publish to beta
        if: steps.ready.outputs.ready == 'true' && needs.prepare.outputs.publish == 'true'
        run: >-
          node scripts/release-client.mjs --platform macos --arch universal --channel beta --publish
          --version "${{ needs.prepare.outputs.version }}" --build "$VEILBIRD_BUILD_NUMBER" --min-os "macOS 13"
          --notes "${{ github.ref_name }} (${{ github.sha }})"
          --file "clients/apple/artifacts/release/TrackNothing-${{ needs.prepare.outputs.version }}-$VEILBIRD_BUILD_NUMBER-macos.dmg"
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/developer-id.p12"
