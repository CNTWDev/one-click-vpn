name: Client release
# Builds installable, signed clients. Every run keeps the installers as downloadable artifacts of the run
# (Actions → this run → Artifacts), so they can be uploaded by hand in Console → 客户端发布. When the
# Controller is configured below, CI also uploads them itself and publishes to the beta channel; promotion
# to stable stays a one-click decision in Console. Step-by-step guide: clients/RELEASING.md.
#
# Trigger: push a tag like client-v1.2.0 (the version must match clients/version.json),
# or run manually. A manual run picks which clients to build in 「平台」: All (default), Android, Windows or macOS;
# each run is listed as "Client release · <平台>". A tag push builds all three. Every run, whatever it builds, takes this workflow's next run number
# as its build number, so builds stay unique and increasing across all platforms.
#
# Android (always): secrets VEILBIRD_ANDROID_KEYSTORE_BASE64, VEILBIRD_ANDROID_KEYSTORE_PASSWORD,
#   VEILBIRD_ANDROID_KEY_ALIAS, VEILBIRD_ANDROID_KEY_PASSWORD (scripts/android-keystore.sh makes them).
# Auto-publish (optional): variable VEILBIRD_RELEASE_API (Controller origin) + secret VEILBIRD_RELEASE_TOKEN.
# Variable VEILBIRD_API_ORIGIN: service origin baked into the apps.
# Windows: an Inno Setup installer per architecture (x64, arm64), always built.
# Mac: a signed, notarized DMG (Developer ID), built once these are set, skipped with a notice otherwise:
#   variables VEILBIRD_APPLE_TEAM_ID, VEILBIRD_APPLE_BUNDLE_ID; secrets VEILBIRD_APPLE_API_KEY_ID,
#   VEILBIRD_APPLE_API_ISSUER_ID, VEILBIRD_APPLE_API_KEY_P8, VEILBIRD_MACOS_DEVELOPER_ID_P12 (base64),
#   VEILBIRD_MACOS_DEVELOPER_ID_P12_PASSWORD. iPhone (TestFlight) comes later; see clients/RELEASING.md.
#   The Mac job only builds, signs and submits the DMG for notarization; a Linux job awaits Apple's answer (up to
#   30 min), then a short Mac job staples and publishes to beta. Slower answers: Run workflow with
#   平台 = macOS notarize and build = <run number>, which checks in seconds.
on:
  push:
    tags: ['client-v*']
  workflow_dispatch:
    inputs:
      platforms:
        description: 平台 / Platforms
        type: choice
        default: All
        options: [All, Android, Windows, macOS, macOS notarize]
      build:
        description: 'macOS notarize: build number (run number) of the run whose DMG to finish'
        type: string
        required: false
run-name: Client release · ${{ inputs.platforms || 'All' }}${{ inputs.build && format(' {0}', inputs.build) || '' }}
permissions:
  contents: read
concurrency:
  group: client-release
  cancel-in-progress: false
env:
  VEILBIRD_BUILD_NUMBER: ${{ github.run_number }}
  VEILBIRD_RELEASE_API: ${{ vars.VEILBIRD_RELEASE_API }}
  VEILBIRD_RELEASE_TOKEN: ${{ secrets.VEILBIRD_RELEASE_TOKEN }}
jobs:
  prepare:
    if: inputs.platforms != 'macOS notarize'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run i18n:check
      - id: version
        run: |
          version=$(jq -r .version clients/version.json)
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "client-v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match clients/version.json ($version)"; exit 1
          fi
          publish=false
          if [[ -n "$VEILBIRD_RELEASE_API" && -n "$VEILBIRD_RELEASE_TOKEN" ]]; then publish=true
          else echo "::notice::VEILBIRD_RELEASE_API / VEILBIRD_RELEASE_TOKEN not set: installers stay as run artifacts for upload in Console"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
  android:
    needs: prepare
    if: (inputs.platforms || 'All') == 'All' || inputs.platforms == 'Android'
    runs-on: ubuntu-latest
    env:
      VEILBIRD_API_ORIGIN: ${{ vars.VEILBIRD_API_ORIGIN }}
      VEILBIRD_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.VEILBIRD_ANDROID_KEYSTORE_PASSWORD }}
      VEILBIRD_ANDROID_KEY_ALIAS: ${{ secrets.VEILBIRD_ANDROID_KEY_ALIAS }}
      VEILBIRD_ANDROID_KEY_PASSWORD: ${{ secrets.VEILBIRD_ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The legacy default 'tools' package no longer exists in the SDK repository.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.5'
      - uses: actions/setup-go@v5
        with:
          go-version-file: clients/core/go.mod
          cache-dependency-path: clients/core/go.sum
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      # The embedded core (mihomo) as an AAR; Gradle links it from app/libs.
      - run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018" bash clients/core/build-android.sh
      - name: Restore signing key
        env:
          KEYSTORE: ${{ secrets.VEILBIRD_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE" ]]; then echo "::error::VEILBIRD_ANDROID_KEYSTORE_BASE64 is not set (run scripts/android-keystore.sh once)"; exit 1; fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "VEILBIRD_ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - run: gradle -p clients/android :app:assembleProdRelease
      - name: Verify signature
        run: |
          # Same build number, two architectures: arm64 for nearly every phone, universal for the rest.
          out=clients/android/app/build/outputs/apk/prod/release name="TrackNothing-${{ needs.prepare.outputs.version }}-$VEILBIRD_BUILD_NUMBER"
          for apk in "$out/app-prod-arm64-v8a-release.apk" "$out/app-prod-universal-release.apk"; do
            "$ANDROID_HOME"/build-tools/35.0.0/apksigner verify --print-certs "$apk"
          done
          mv "$out/app-prod-arm64-v8a-release.apk" "$name-arm64.apk"
          mv "$out/app-prod-universal-release.apk" "$name.apk"
          ls -l TrackNothing-*.apk
          # The version's notes from clients/CHANGELOG.md: Console 「导入 GitHub 构建包」 fills 更新说明 with them.
          node scripts/client-changelog.mjs "${{ needs.prepare.outputs.version }}" > release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: TrackNothing-android-${{ needs.prepare.outputs.version }}-${{ github.run_number }}
          path: |
            TrackNothing-*.apk
            release-notes.md
          if-no-files-found: error
      - uses: actions/setup-node@v4
        if: needs.prepare.outputs.publish == 'true'
        with:
          node-version: '22'
      - name: Publish to beta
        if: needs.prepare.outputs.publish == 'true'
        run: |
          name="TrackNothing-${{ needs.prepare.outputs.version }}-$VEILBIRD_BUILD_NUMBER"
          for arch in arm64 universal; do
            file="$name.apk"; [[ $arch == arm64 ]] && file="$name-arm64.apk"
            node scripts/release-client.mjs --platform android --arch "$arch" --channel beta --publish \
              --version "${{ needs.prepare.outputs.version }}" --build "$VEILBIRD_BUILD_NUMBER" --min-os "Android 8.0" --file "$file"
          done
      - run: rm -f "$RUNNER_TEMP/release.jks"
        if: always()
  windows:
    needs: prepare
    if: (inputs.platforms || 'All') == 'All' || inputs.platforms == 'Windows'
    runs-on: windows-latest
    env:
      VEILBIRD_API_ORIGIN: ${{ vars.VEILBIRD_API_ORIGIN }}
    strategy:
      matrix:
        include:
          - runtime: win-x64
            arch: x64
          - runtime: win-arm64
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # The shared core (veilbird-core.exe) is cross-built with Go by build.ps1.
      - uses: actions/setup-go@v5
        with:
          go-version-file: clients/core/go.mod
          cache-dependency-path: clients/core/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - shell: pwsh
        run: ./clients/windows/build.ps1 -Runtime ${{ matrix.runtime }} -Version ${{ needs.prepare.outputs.version }} -Build $env:VEILBIRD_BUILD_NUMBER -Installer
      - shell: bash
        run: node scripts/client-changelog.mjs "${{ needs.prepare.outputs.version }}" > clients/windows/artifacts/release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: TrackNothing-windows-${{ matrix.arch }}-${{ needs.prepare.outputs.version }}-${{ github.run_number }}
          path: |
            clients/windows/artifacts/TrackNothing-*-setup.exe
            clients/windows/artifacts/release-notes.md
          if-no-files-found: error
      - shell: pwsh
        if: needs.prepare.outputs.publish == 'true'
        run: >-
          node scripts/release-client.mjs --platform windows --arch ${{ matrix.arch }} --channel beta --publish
          --version "${{ needs.prepare.outputs.version }}" --build "$env:VEILBIRD_BUILD_NUMBER" --min-os "Windows 10"
          --file "clients/windows/artifacts/TrackNothing-${{ needs.prepare.outputs.version }}-$env:VEILBIRD_BUILD_NUMBER-${{ matrix.runtime }}-setup.exe"
  macos:
    needs: prepare
    if: (inputs.platforms || 'All') == 'All' || inputs.platforms == 'macOS'
    runs-on: macos-15
    outputs:
      submitted: ${{ steps.submit.outputs.submitted }}
    env:
      VEILBIRD_API_ORIGIN: ${{ vars.VEILBIRD_API_ORIGIN }}
      VEILBIRD_APPLE_TEAM_ID: ${{ vars.VEILBIRD_APPLE_TEAM_ID }}
      VEILBIRD_APPLE_BUNDLE_ID: ${{ vars.VEILBIRD_APPLE_BUNDLE_ID }}
      VEILBIRD_APPLE_API_KEY_ID: ${{ secrets.VEILBIRD_APPLE_API_KEY_ID }}
      VEILBIRD_APPLE_API_ISSUER_ID: ${{ secrets.VEILBIRD_APPLE_API_ISSUER_ID }}
      VEILBIRD_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - id: ready
        env:
          P8: ${{ secrets.VEILBIRD_APPLE_API_KEY_P8 }}
          P12: ${{ secrets.VEILBIRD_MACOS_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.VEILBIRD_MACOS_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          missing=""
          for name in VEILBIRD_APPLE_TEAM_ID VEILBIRD_APPLE_BUNDLE_ID VEILBIRD_APPLE_API_KEY_ID VEILBIRD_APPLE_API_ISSUER_ID P8 P12 P12_PASSWORD; do
            [[ -n "${!name}" ]] || missing="$missing $name"
          done
          if [[ -n "$missing" ]]; then
            echo "::notice::Mac DMG skipped: Apple signing is not configured (missing:$missing). See clients/RELEASING.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else echo "ready=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.ready.outputs.ready == 'true'
      - uses: actions/setup-go@v5
        if: steps.ready.outputs.ready == 'true'
        with:
          go-version-file: clients/core/go.mod
          cache-dependency-path: clients/core/go.sum
      - uses: actions/setup-node@v4
        if: steps.ready.outputs.ready == 'true'
        with:
          node-version: '22'
      - run: brew install xcodegen
        if: steps.ready.outputs.ready == 'true'
      # The embedded core (mihomo, ~10 min to compile) is rebuilt only when it changes: build-apple.sh skips the
      # build when the restored framework's stamp matches the sources.
      - uses: actions/cache@v4
        if: steps.ready.outputs.ready == 'true'
        with:
          path: clients/apple/.deps/TunnelCore.xcframework
          key: tunnelcore-macos-${{ hashFiles('clients/core/go.mod', 'clients/core/go.sum', 'clients/core/**/*.go', 'clients/core/build-apple.sh') }}
      - name: Import signing certificate and API key
        if: steps.ready.outputs.ready == 'true'
        env:
          P8: ${{ secrets.VEILBIRD_APPLE_API_KEY_P8 }}
          P12: ${{ secrets.VEILBIRD_MACOS_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.VEILBIRD_MACOS_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db" password=$(openssl rand -hex 16)
          echo "$P12" | base64 -d > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          # The Developer ID intermediate, in case the runner image lacks it.
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain" -T /usr/bin/codesign || true
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$P12_PASSWORD" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/developer-id.p12"
          printf '%s\n' "$P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "VEILBIRD_APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Install provisioning profiles
        if: steps.ready.outputs.ready == 'true'
        run: >-
          node scripts/apple-profiles.mjs --type MAC_APP_DIRECT
          --bundle "$VEILBIRD_APPLE_BUNDLE_ID.macos=VEILBIRD_MACOS_APP_PROFILE"
          --bundle "$VEILBIRD_APPLE_BUNDLE_ID.macos.tunnel=VEILBIRD_MACOS_TUNNEL_PROFILE" >> "$GITHUB_ENV"
      - name: Build and sign
        if: steps.ready.outputs.ready == 'true'
        run: bash clients/apple/scripts/release-macos.sh build
      # The signed DMG; 「macOS notarize」 replaces it with the stapled copy once Apple accepts it.
      - if: steps.ready.outputs.ready == 'true'
        run: node scripts/client-changelog.mjs "${{ needs.prepare.outputs.version }}" > clients/apple/artifacts/release/release-notes.md
      - uses: actions/upload-artifact@v4
        if: steps.ready.outputs.ready == 'true'
        with:
          name: TrackNothing-macos-${{ needs.prepare.outputs.version }}-${{ github.run_number }}
          path: |
            clients/apple/artifacts/release/TrackNothing-*-macos.dmg
            clients/apple/artifacts/release/release-notes.md
          if-no-files-found: error
      # Apple's answer (minutes, sometimes hours) is awaited by the cheap Linux job notary-status, not on this Mac.
      - name: Submit for notarization
        id: submit
        if: steps.ready.outputs.ready == 'true'
        run: |
          bash clients/apple/scripts/release-macos.sh submit
          echo "submitted=true" >> "$GITHUB_OUTPUT"
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/developer-id.p12"
  # Apple's answer for a Mac build, asked from Linux (seconds per check, a tenth of the Mac price). After a Mac build in
  # this run it asks every minute for up to 30 min; with 平台 = macOS notarize it checks build <build> once. Accepted →
  # macos-notarize staples and publishes; still in progress → ends with a notice (check later with macOS notarize).
  notary-status:
    needs: [prepare, macos]
    if: always() && (inputs.platforms == 'macOS notarize' || needs.macos.outputs.submitted == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      VEILBIRD_BUILD_NUMBER: ${{ inputs.platforms == 'macOS notarize' && inputs.build || github.run_number }}
      VEILBIRD_APPLE_API_KEY_ID: ${{ secrets.VEILBIRD_APPLE_API_KEY_ID }}
      VEILBIRD_APPLE_API_ISSUER_ID: ${{ secrets.VEILBIRD_APPLE_API_ISSUER_ID }}
    outputs:
      status: ${{ steps.status.outputs.status }}
      build: ${{ env.VEILBIRD_BUILD_NUMBER }}
      run: ${{ steps.source.outputs.run }}
      artifact: ${{ steps.source.outputs.artifact }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Find the build's DMG
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$VEILBIRD_BUILD_NUMBER" =~ ^[0-9]+$ ]] || { echo "::error::Set 「build」 to the run number of the Mac build (e.g. 18)."; exit 1; }
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/client-release.yml/runs?per_page=100" \
            --jq ".workflow_runs[] | select(.run_number == $VEILBIRD_BUILD_NUMBER) | .id")
          artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts" --jq '.artifacts[] | select(.name | startswith("TrackNothing-macos-")) | .name')
          [[ -n "$run" && -n "$artifact" ]] || { echo "::error::Run $VEILBIRD_BUILD_NUMBER has no TrackNothing-macos artifact."; exit 1; }
          version=${artifact#TrackNothing-macos-}; version=${version%-*}
          { echo "run=$run"; echo "artifact=$artifact"; echo "version=$version"; } >> "$GITHUB_OUTPUT"
      - id: status
        env:
          P8: ${{ secrets.VEILBIRD_APPLE_API_KEY_P8 }}
          WAIT: ${{ inputs.platforms == 'macOS notarize' && '0' || '30' }}
        run: |
          printf '%s\n' "$P8" > "$RUNNER_TEMP/AuthKey.p8"
          VEILBIRD_APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8" node scripts/apple-notary.mjs --wait "$WAIT" \
            --name "TrackNothing-${{ steps.source.outputs.version }}-$VEILBIRD_BUILD_NUMBER-macos.dmg"
          rm -f "$RUNNER_TEMP/AuthKey.p8"
      - name: Result
        env:
          STATUS: ${{ steps.status.outputs.status }}
        run: |
          case "$STATUS" in
            Accepted) echo "::notice::Accepted by Apple: stapling and publishing build $VEILBIRD_BUILD_NUMBER." ;;
            "In Progress") echo "::notice::Apple is still notarizing build $VEILBIRD_BUILD_NUMBER. Check later: Run workflow, 平台 = macOS notarize, build = $VEILBIRD_BUILD_NUMBER." ;;
            *) echo "::error::Apple did not accept build $VEILBIRD_BUILD_NUMBER: $STATUS (log above)."; exit 1 ;;
          esac
  # Accepted: staple the ticket (so the app opens offline too), replace the artifact, publish to beta (~2 min of Mac).
  macos-notarize:
    needs: notary-status
    if: always() && needs.notary-status.outputs.status == 'Accepted'
    runs-on: macos-15
    permissions:
      contents: read
      actions: read
    env:
      VEILBIRD_BUILD_NUMBER: ${{ needs.notary-status.outputs.build }}
      VEILBIRD_VERSION: ${{ needs.notary-status.outputs.version }}
      VEILBIRD_APPLE_API_KEY_ID: ${{ secrets.VEILBIRD_APPLE_API_KEY_ID }}
      VEILBIRD_APPLE_API_ISSUER_ID: ${{ secrets.VEILBIRD_APPLE_API_ISSUER_ID }}
      VEILBIRD_NOTARY_RESUME: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.notary-status.outputs.artifact }}
          run-id: ${{ needs.notary-status.outputs.run }}
          github-token: ${{ github.token }}
          path: clients/apple/artifacts/release
      - name: API key
        env:
          P8: ${{ secrets.VEILBIRD_APPLE_API_KEY_P8 }}
        run: |
          printf '%s\n' "$P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "VEILBIRD_APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Staple
        run: bash clients/apple/scripts/release-macos.sh notarize
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.notary-status.outputs.artifact }}
          path: |
            clients/apple/artifacts/release/TrackNothing-*-macos.dmg
            clients/apple/artifacts/release/release-notes.md
          if-no-files-found: error
          overwrite: true
      - name: Publish to beta
        if: env.VEILBIRD_RELEASE_API != '' && env.VEILBIRD_RELEASE_TOKEN != ''
        run: >-
          node scripts/release-client.mjs --platform macos --arch universal --channel beta --publish
          --version "$VEILBIRD_VERSION" --build "$VEILBIRD_BUILD_NUMBER" --min-os "macOS 13"
          --file "clients/apple/artifacts/release/TrackNothing-$VEILBIRD_VERSION-$VEILBIRD_BUILD_NUMBER-macos.dmg"
      - name: Remove API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
