name: Client release
# Builds installable, signed clients. Every run keeps the installers as downloadable artifacts of the run
# (Actions → this run → Artifacts), so they can be uploaded by hand in Console → 客户端发布. When the
# Controller is configured below, CI also uploads them itself and publishes to the beta channel; promotion
# to stable stays a one-click decision in Console. Step-by-step guide: clients/RELEASING.md.
#
# Trigger: push a tag like client-v1.2.0 (the version must match clients/version.json),
# or run manually. The build number is this workflow's run number.
#
# Android (always): secrets VEILBIRD_ANDROID_KEYSTORE_BASE64, VEILBIRD_ANDROID_KEYSTORE_PASSWORD,
#   VEILBIRD_ANDROID_KEY_ALIAS, VEILBIRD_ANDROID_KEY_PASSWORD (scripts/android-keystore.sh makes them).
# Auto-publish (optional): variable VEILBIRD_RELEASE_API (Controller origin) + secret VEILBIRD_RELEASE_TOKEN.
# Variable VEILBIRD_API_ORIGIN: service origin baked into the apps.
# Windows: an Inno Setup installer per architecture (x64, arm64), always built.
# iPhone / Mac need an Apple Developer account first; see clients/RELEASING.md.
on:
  push:
    tags: ['client-v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: client-release
  cancel-in-progress: false
env:
  VEILBIRD_BUILD_NUMBER: ${{ github.run_number }}
  VEILBIRD_RELEASE_API: ${{ vars.VEILBIRD_RELEASE_API }}
  VEILBIRD_RELEASE_TOKEN: ${{ secrets.VEILBIRD_RELEASE_TOKEN }}
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run i18n:check
      - id: version
        run: |
          version=$(jq -r .version clients/version.json)
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "client-v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match clients/version.json ($version)"; exit 1
          fi
          publish=false
          if [[ -n "$VEILBIRD_RELEASE_API" && -n "$VEILBIRD_RELEASE_TOKEN" ]]; then publish=true
          else echo "::notice::VEILBIRD_RELEASE_API / VEILBIRD_RELEASE_TOKEN not set: installers stay as run artifacts for upload in Console"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
  android:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      VEILBIRD_API_ORIGIN: ${{ vars.VEILBIRD_API_ORIGIN }}
      VEILBIRD_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.VEILBIRD_ANDROID_KEYSTORE_PASSWORD }}
      VEILBIRD_ANDROID_KEY_ALIAS: ${{ secrets.VEILBIRD_ANDROID_KEY_ALIAS }}
      VEILBIRD_ANDROID_KEY_PASSWORD: ${{ secrets.VEILBIRD_ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The legacy default 'tools' package no longer exists in the SDK repository.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.5'
      - uses: actions/setup-go@v5
        with:
          go-version-file: clients/android/core/go.mod
          cache-dependency-path: clients/android/core/go.sum
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      # The embedded core (mihomo) as an AAR; Gradle links it from app/libs.
      - run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018" bash clients/android/core/build.sh
      - name: Restore signing key
        env:
          KEYSTORE: ${{ secrets.VEILBIRD_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE" ]]; then echo "::error::VEILBIRD_ANDROID_KEYSTORE_BASE64 is not set (run scripts/android-keystore.sh once)"; exit 1; fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "VEILBIRD_ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - run: gradle -p clients/android :app:assembleProdRelease
      - name: Verify signature
        run: |
          apk=clients/android/app/build/outputs/apk/prod/release/app-prod-release.apk
          "$ANDROID_HOME"/build-tools/35.0.0/apksigner verify --print-certs "$apk"
          mv "$apk" "Veilbird-${{ needs.prepare.outputs.version }}-$VEILBIRD_BUILD_NUMBER.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Veilbird-android-${{ needs.prepare.outputs.version }}-${{ github.run_number }}
          path: Veilbird-*.apk
          if-no-files-found: error
      - uses: actions/setup-node@v4
        if: needs.prepare.outputs.publish == 'true'
        with:
          node-version: '22'
      - name: Publish to beta
        if: needs.prepare.outputs.publish == 'true'
        run: >-
          node scripts/release-client.mjs --platform android --arch universal --channel beta --publish
          --version "${{ needs.prepare.outputs.version }}" --build "$VEILBIRD_BUILD_NUMBER" --min-os "Android 8.0"
          --notes "${{ github.ref_name }} (${{ github.sha }})"
          --file "Veilbird-${{ needs.prepare.outputs.version }}-$VEILBIRD_BUILD_NUMBER.apk"
      - run: rm -f "$RUNNER_TEMP/release.jks"
        if: always()
  windows:
    needs: prepare
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - runtime: win-x64
            arch: x64
          - runtime: win-arm64
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - shell: pwsh
        run: ./clients/windows/build.ps1 -Runtime ${{ matrix.runtime }} -Version ${{ needs.prepare.outputs.version }} -Build $env:VEILBIRD_BUILD_NUMBER -Installer
      - uses: actions/upload-artifact@v4
        with:
          name: Veilbird-windows-${{ matrix.arch }}-${{ needs.prepare.outputs.version }}-${{ github.run_number }}
          path: clients/windows/artifacts/Veilbird-*-setup.exe
          if-no-files-found: error
      - shell: pwsh
        if: needs.prepare.outputs.publish == 'true'
        run: >-
          node scripts/release-client.mjs --platform windows --arch ${{ matrix.arch }} --channel beta --publish
          --version "${{ needs.prepare.outputs.version }}" --build "$env:VEILBIRD_BUILD_NUMBER" --min-os "Windows 10"
          --notes "${{ github.ref_name }} (${{ github.sha }})"
          --file "clients/windows/artifacts/Veilbird-${{ needs.prepare.outputs.version }}-$env:VEILBIRD_BUILD_NUMBER-${{ matrix.runtime }}-setup.exe"
