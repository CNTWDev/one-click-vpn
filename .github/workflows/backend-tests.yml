name: Backend tests
# Controller (app/ + server/), migrations, subscriptions and the node Agent (agent/agent.py), against a real
# PostgreSQL and the same pinned Mihomo and Xray versions the nodes install. Browser layout checks live in
# console-ui.yml; native client builds in native-clients.yml.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']
permissions:
  contents: read
concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    # Pinned like console-ui.yml so a runner image change does not break the job unannounced.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: veilbird
          POSTGRES_PASSWORD: veilbird
          POSTGRES_DB: veilbird_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U veilbird -d veilbird_test" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Separate databases: the automation and REALITY tests reset tables the main suite relies on.
      VEILBIRD_TEST_DATABASE_URL: postgres://veilbird:veilbird@127.0.0.1:5432/veilbird_test
      VEILBIRD_TEST_AUTOMATION_DATABASE_URL: postgres://veilbird:veilbird@127.0.0.1:5432/veilbird_automation
      VEILBIRD_TEST_REALITY_DATABASE_URL: postgres://veilbird:veilbird@127.0.0.1:5432/veilbird_reality
      VEILBIRD_NATIVE_TEST_DATABASE_URL: postgres://veilbird:veilbird@127.0.0.1:5432/veilbird_native
      # client-releases-api falls back to the native database; both start a Controller at once, so it gets its own.
      VEILBIRD_RELEASE_TEST_DATABASE_URL: postgres://veilbird:veilbird@127.0.0.1:5432/veilbird_release
      # Keep in step with the versions agent/agent.py installs on nodes.
      MIHOMO_VERSION: v1.19.33
      XRAY_VERSION: v26.3.27
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create the extra test databases
        env:
          PGPASSWORD: veilbird
        run: |
          for db in veilbird_automation veilbird_reality veilbird_native veilbird_release; do
            psql -h 127.0.0.1 -U veilbird -d veilbird_test -c "CREATE DATABASE $db"
          done
      - name: Install pinned Mihomo and Xray
        run: |
          grep -q "mihomo/releases/download/$MIHOMO_VERSION/" agent/agent.py || { echo "::error::MIHOMO_VERSION differs from agent/agent.py"; exit 1; }
          grep -q "Xray-core/releases/download/$XRAY_VERSION/" agent/agent.py || { echo "::error::XRAY_VERSION differs from agent/agent.py"; exit 1; }
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP/bin"
          curl -fsSL --retry 3 -o mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/$MIHOMO_VERSION/mihomo-linux-amd64-$MIHOMO_VERSION.gz"
          gunzip mihomo.gz && chmod +x mihomo
          curl -fsSL --retry 3 -o xray.zip "https://github.com/XTLS/Xray-core/releases/download/$XRAY_VERSION/Xray-linux-64.zip"
          unzip -q xray.zip xray && chmod +x xray
          ./mihomo -v && ./xray version
          echo "VEILBIRD_TEST_MIHOMO=$RUNNER_TEMP/bin/mihomo" >> "$GITHUB_ENV"
          echo "VEILBIRD_TEST_XRAY=$RUNNER_TEMP/bin/xray" >> "$GITHUB_ENV"
      # node_modules restored whole while package-lock.json is unchanged (saved by master runs, shared by all ubuntu-24.04
      # jobs); npm ci only on a miss, saved straight away so later steps cannot add to it.
      - id: modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-ubuntu-24.04-node22-${{ hashFiles('package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
      - if: steps.modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: node_modules
          key: ${{ steps.modules.outputs.cache-primary-key }}
      - run: npm run typecheck
      # The integration tests start the built Controller (next start) and serve the built frontends.
      - run: npm run build
      - name: Controller, API and integration tests
        run: node --experimental-strip-types --test tests/*.test.mjs
      - name: Agent tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
