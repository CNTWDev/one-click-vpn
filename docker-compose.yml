# Docker keeps container output forever by default; cap it so long-running hosts do not fill up.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Static-only site. No controller routes, credentials, database or Docker socket.
  reality-target:
    image: ${VEILBIRD_IMAGE_PREFIX:-tracknothing}-reality-target:${VEILBIRD_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: deploy/reality-target/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
    networks: [reality-site]
    ports:
      - "127.0.0.1:3300:3300"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3300/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: northstar
      POSTGRES_USER: northstar
      POSTGRES_PASSWORD: ${VEILBIRD_DB_PASSWORD:?VEILBIRD_DB_PASSWORD is required}
    volumes:
      - northstar-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U northstar -d northstar"]
      interval: 5s
      timeout: 5s
      retries: 20

  veilbird:
    # Pulled from the registry CI pushes to when VEILBIRD_IMAGE_PREFIX is set; otherwise built here
    # (scripts/deploy.sh decides). The tag is the commit, so an older tag is a rollback.
    image: ${VEILBIRD_IMAGE_PREFIX:-tracknothing}-veilbird:${VEILBIRD_IMAGE_TAG:-local}
    build:
      context: .
      args:
        VEILBIRD_BUILD_REV: ${VEILBIRD_BUILD_REV:-unknown}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
      loki:
        condition: service_started
    env_file: .env
    environment:
      VEILBIRD_DATABASE_URL: postgresql://northstar:${VEILBIRD_DB_PASSWORD:?VEILBIRD_DB_PASSWORD is required}@db:5432/northstar
      VEILBIRD_BUILD_REV: ${VEILBIRD_BUILD_REV:-unknown}
      HOSTNAME: 0.0.0.0
      PORT: 3000
      VEILBIRD_LOKI_URL: http://loki:3100
    # HTTPS and the public hostname are managed by the host's Nginx.
    # Keep the controller reachable only from this ECS host.
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # Client installers uploaded from Console (VEILBIRD_RELEASE_STORAGE=local, the default).
      - northstar-client-releases:/app/data/client-releases
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      start_period: 10s
      interval: 30s
      timeout: 5s
      retries: 5

  portal-web:
    image: ${VEILBIRD_IMAGE_PREFIX:-tracknothing}-portal-web:${VEILBIRD_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: portal-runtime
      args:
        PORT: 3100
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      veilbird:
        condition: service_healthy
    environment:
      PORT: 3100
      API_UPSTREAM: http://veilbird:3000
    ports:
      - "127.0.0.1:3100:3100"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5

  admin-web:
    image: ${VEILBIRD_IMAGE_PREFIX:-tracknothing}-admin-web:${VEILBIRD_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: admin-runtime
      args:
        PORT: 3200
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      veilbird:
        condition: service_healthy
    environment:
      PORT: 3200
      API_UPSTREAM: http://veilbird:3000
    ports:
      - "127.0.0.1:3200:3200"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3200/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5

  loki:
    image: grafana/loki:3.6.1
    restart: unless-stopped
    logging: *default-logging
    command: -config.file=/etc/loki/loki.yml -config.expand-env=true
    environment:
      # Set by scripts/deploy.sh from loki.yml so an edited config recreates the container.
      VEILBIRD_LOKI_CONFIG_SHA: ${VEILBIRD_LOKI_CONFIG_SHA:-}
    volumes:
      - ./deploy/loki/loki.yml:/etc/loki/loki.yml:ro
      - northstar-loki:/loki

volumes:
  northstar-client-releases:
  northstar-postgres:
  northstar-loki:

networks:
  reality-site:
    internal: true
