services:
  northstar:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NORTHSTAR_DATABASE_PATH: /app/data/northstar.sqlite
      HOSTNAME: 0.0.0.0
    volumes:
      - northstar-data:/app/data
    # HTTPS and the public hostname are managed by the host's Nginx.
    # Keep the controller reachable only from this ECS host.
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      start_period: 10s
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  northstar-data:
