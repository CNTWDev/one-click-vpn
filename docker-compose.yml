services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: northstar
      POSTGRES_USER: northstar
      POSTGRES_PASSWORD: ${NORTHSTAR_DB_PASSWORD:?NORTHSTAR_DB_PASSWORD is required}
    volumes:
      - northstar-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U northstar -d northstar"]
      interval: 5s
      timeout: 5s
      retries: 20

  northstar:
    build:
      context: .
      args:
        NORTHSTAR_BUILD_REV: ${NORTHSTAR_BUILD_REV:-unknown}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      loki:
        condition: service_started
    env_file: .env
    environment:
      NORTHSTAR_DATABASE_URL: postgresql://northstar:${NORTHSTAR_DB_PASSWORD:?NORTHSTAR_DB_PASSWORD is required}@db:5432/northstar
      NORTHSTAR_BUILD_REV: ${NORTHSTAR_BUILD_REV:-unknown}
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NORTHSTAR_LOKI_URL: http://loki:3100
    # HTTPS and the public hostname are managed by the host's Nginx.
    # Keep the controller reachable only from this ECS host.
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      start_period: 10s
      interval: 30s
      timeout: 5s
      retries: 5

  portal-web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        FRONTEND: portal
        PORT: 3100
    restart: unless-stopped
    depends_on:
      northstar:
        condition: service_healthy
    environment:
      PORT: 3100
    ports:
      - "127.0.0.1:3100:3100"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5

  admin-web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        FRONTEND: admin-web
        PORT: 3200
    restart: unless-stopped
    depends_on:
      northstar:
        condition: service_healthy
    environment:
      PORT: 3200
    ports:
      - "127.0.0.1:3200:3200"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3200/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: northstar
      MINIO_ROOT_PASSWORD: ${NORTHSTAR_LOG_STORAGE_PASSWORD:?NORTHSTAR_LOG_STORAGE_PASSWORD is required}
    volumes:
      - northstar-minio:/data

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: "no"
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_PASSWORD: ${NORTHSTAR_LOG_STORAGE_PASSWORD:?NORTHSTAR_LOG_STORAGE_PASSWORD is required}
    entrypoint: ["/bin/sh", "-ec"]
    command: |
      attempts=0
      until mc alias set local http://minio:9000 northstar "$$MINIO_ROOT_PASSWORD"; do
        attempts=$$((attempts + 1))
        [ "$$attempts" -lt 60 ] || { echo "MinIO did not accept credentials within 120 seconds" >&2; exit 1; }
        sleep 2
      done
      attempts=0
      until mc mb --ignore-existing local/northstar-logs; do
        attempts=$$((attempts + 1))
        [ "$$attempts" -lt 60 ] || { echo "MinIO bucket initialization did not complete within 120 seconds" >&2; exit 1; }
        sleep 2
      done

  loki:
    image: grafana/loki:3.6.1
    restart: unless-stopped
    depends_on:
      minio-init:
        condition: service_completed_successfully
    command: -config.file=/etc/loki/loki.yml -config.expand-env=true
    environment:
      NORTHSTAR_LOG_STORAGE_PASSWORD: ${NORTHSTAR_LOG_STORAGE_PASSWORD:?NORTHSTAR_LOG_STORAGE_PASSWORD is required}
    volumes:
      - ./deploy/loki/loki.yml:/etc/loki/loki.yml:ro
      - northstar-loki:/loki

volumes:
  northstar-postgres:
  northstar-minio:
  northstar-loki:
