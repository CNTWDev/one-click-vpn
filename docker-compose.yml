services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: northstar
      POSTGRES_USER: northstar
      POSTGRES_PASSWORD: ${NORTHSTAR_DB_PASSWORD:?NORTHSTAR_DB_PASSWORD is required}
    volumes:
      - northstar-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U northstar -d northstar"]
      interval: 5s
      timeout: 5s
      retries: 20

  northstar:
    build:
      context: .
      args:
        NORTHSTAR_BUILD_REV: ${NORTHSTAR_BUILD_REV:-unknown}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      NORTHSTAR_DATABASE_URL: postgresql://northstar:${NORTHSTAR_DB_PASSWORD:?NORTHSTAR_DB_PASSWORD is required}@db:5432/northstar
      NORTHSTAR_BUILD_REV: ${NORTHSTAR_BUILD_REV:-unknown}
      HOSTNAME: 0.0.0.0
      PORT: 3000
    # HTTPS and the public hostname are managed by the host's Nginx.
    # Keep the controller reachable only from this ECS host.
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      start_period: 10s
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  northstar-postgres:
